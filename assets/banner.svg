<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 220" width="100%" height="220" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c" />
      <stop offset="50%" stop-color="#111116" />
      <stop offset="100%" stop-color="#08080a" />
    </linearGradient>

    <!-- Accent Glows -->
    <radialGradient id="glowLime" cx="15%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#a3e635" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowViolet" cx="85%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Dot Pattern -->
    <pattern id="dotPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.04" />
    </pattern>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#27272a" />
      <stop offset="70%" stop-color="#3f3f46" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect x="1" y="1" width="848" height="218" rx="14" fill="url(#bg)" />
  <rect x="1" y="1" width="848" height="218" rx="14" fill="url(#glowLime)" />
  <rect x="1" y="1" width="848" height="218" rx="14" fill="url(#glowViolet)" />
  <rect x="1" y="1" width="848" height="218" rx="14" fill="url(#dotPattern)" />
  <rect x="1" y="1" width="848" height="218" rx="14" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Window Control Dots -->
  <circle cx="36" cy="32" r="5" fill="#ef4444" fill-opacity="0.8" />
  <circle cx="52" cy="32" r="5" fill="#eab308" fill-opacity="0.8" />
  <circle cx="68" cy="32" r="5" fill="#22c55e" fill-opacity="0.8" />
  <text x="92" y="36" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">allan@system ~ % ./launch_profile</text>

  <!-- Main Headline -->
  <text x="36" y="98" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
    ALLAN INDRAJITH
  </text>

  <!-- Subtitle -->
  <text x="36" y="132" fill="#a3e635" font-family="'SF Mono', Monaco, Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" font-weight="600" letter-spacing="1.5">
    FULL-STACK ENGINEER  //  AI AGENT ARCHITECT  //  CREATIVE STRATEGIST
  </text>

  <!-- Divider Line -->
  <line x1="36" y1="154" x2="814" y2="154" stroke="#27272a" stroke-width="1" />

  <!-- Bottom Badges / Metadata -->
  <g transform="translate(36, 172)">
    <!-- Status Pill -->
    <rect x="0" y="0" width="170" height="26" rx="13" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#22c55e" />
    <text x="26" y="17" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">Available for Projects</text>

    <!-- Location Pill -->
    <rect x="182" y="0" width="155" height="26" rx="13" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <text x="195" y="17" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500">📍 Vilnius, Lithuania</text>

    <!-- Focus Pill -->
    <rect x="349" y="0" width="220" height="26" rx="13" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <text x="362" y="17" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500">⚡ Web Apps &amp; Agent Systems</text>
  </g>
</svg>
